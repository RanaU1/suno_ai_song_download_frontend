<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Server status | Suno Ai Song Download</title>
    <meta name="description"
        content="Live status of the Suno Ai Song Download server: online or error, with response time.">
    <link rel="canonical" href="https://sunoaisongdownload.online/status.html">
    <meta property="og:url" content="https://sunoaisongdownload.online/status.html">
    <meta name="theme-color" content="#0ea5e9">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Suno Ai Song Download">
    <meta property="og:title" content="Server status | Suno Ai Song Download">
    <meta property="og:description"
        content="Live status of the Suno Ai Song Download server: online or error, with response time.">
    <meta name="twitter:card" content="summary">

    <link rel="icon" href="/static/favicon.ico">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/pages.css">

</head>

<body>
    <!-- Decorative background (same as the home page) -->
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-grid"></div>

    <div id="site-nav" data-include="/components/navbar.html"></div>

    <main>
        <section class="page-hero">
            <div class="container">
                <span class="page-kicker"><i class="bi bi-activity"></i> Server status</span>
                <h1>Is the server <em>online right now?</em></h1>
                <p class="lead">This page asks our server directly. If it shows an error, the downloader cannot work
                    until it is back.</p>

            </div>
        </section>
        <section class="workspace-section pt-0 ">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-xl-8">
                        <div class="workspace-card text-center">
                            <div class="server-status-pill status-big is-checking" id="statusPill" role="status"
                                aria-live="polite">
                                <span class="status-dot"></span>
                                <span id="statusText">Checking…</span>
                            </div>

                            <div class="row g-3 mt-3 text-start">
                                <div class="col-sm-4">
                                    <div class="metric"><span>Status</span><strong id="mStatus">…</strong></div>
                                </div>
                                <div class="col-sm-4">
                                    <div class="metric"><span>Response time</span><strong id="mTime">…</strong></div>
                                </div>
                                <div class="col-sm-4">
                                    <div class="metric"><span>Last checked</span><strong id="mChecked">…</strong></div>
                                </div>
                            </div>

                            <button type="button" class="btn-main mt-4" id="recheck"><i
                                    class="bi bi-arrow-clockwise"></i> Check again</button>

                            <div class="callout mt-4 mb-0 text-start">
                                <i class="bi bi-info-circle-fill"></i>
                                <p>Red but your internet works? Wait a minute and check again. If it stays red, please
                                    <a href="/contact.html">tell us</a>.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="site-footer" data-include="/components/footer.html"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/site.js"></script>
    <script>
        const el = id => document.getElementById(id);

        function setPill(state, text) {
            const pill = el('statusPill');
            pill.classList.remove('is-checking', 'is-online', 'is-offline');
            pill.classList.add('is-' + state);
            el('statusText').textContent = text;
        }

        async function runCheck() {
            const btn = el('recheck');
            btn.disabled = true;
            setPill('checking', 'Checking…');
            const r = await pingServer();       // from site.js
            setPill(r.ok ? 'online' : 'offline', r.ok ? 'All systems operational' : 'Server error — contact admin');
            el('mStatus').textContent = r.ok ? 'Online' : 'Unreachable';
            el('mTime').textContent = r.ms != null ? r.ms + ' ms' : '—';
            el('mChecked').textContent = new Date().toLocaleTimeString();
            btn.disabled = false;
        }

        el('recheck').addEventListener('click', runCheck);
        runCheck();
    </script>
</body>

</html>
